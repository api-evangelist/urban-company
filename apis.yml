name: Urban Company
description: >-
  Urban Company (formerly UrbanClap) is a home services marketplace that
  connects consumers with trained, background-verified professionals for home
  services, appliance and electronics repair, beauty and salon-at-home
  services, spa, cleaning, plumbing, electrical, painting, and carpentry work.
  It operates across cities in India as well as international markets
  including the UAE and Saudi Arabia, serving customers through its website
  and iOS/Android apps, while service professionals join and manage work
  through a dedicated partner platform. The company maintains an investor
  relations site and publishes an information security policy statement.
  Urban Company was surfaced as a portfolio company of Bessemer Venture
  Partners and Prosus Ventures and added to the API Evangelist network for
  enrichment. It does not publish a public developer API program; its
  engineering team maintains the urbanclap-engg open-source GitHub
  organization and an engineering blog on Medium.
